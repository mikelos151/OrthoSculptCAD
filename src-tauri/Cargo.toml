[package]
name = "orthosculpt-cad"
version = "0.1.0"
description = "Local O&P engineering research prototype"
edition = "2021"
license = "MIT"
default-run = "orthosculpt-cad"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ortho-geometry = { path = "../crates/ortho-geometry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
